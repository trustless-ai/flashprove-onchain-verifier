[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
# The anvil smoke script passes many deployment parameters through one function; via-IR avoids
# the legacy pipeline's stack-too-deep there without changing the contracts' behaviour.
via_ir = true

[fmt]
line_length = 100
