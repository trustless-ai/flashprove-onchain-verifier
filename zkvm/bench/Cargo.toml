[package]
name = "bench"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "bench"
path = "src/main.rs"

[dependencies]
sp1-zkvm = "=6.10.0"
# Candidate A: the current implementation, reused read-only.
fp-core = { path = "../../rust-nostd-verifier/fp-core" }
# Candidate C: a portable BLAKE2b implementation for comparison (no_std). It is a dependency of
# this benchmark crate only; it is not added to fp-core.
blake2b_simd = { version = "=1.0.5", default-features = false }
